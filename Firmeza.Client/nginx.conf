server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Avoid serving a stale SPA (or another project's cached index) on localhost.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
